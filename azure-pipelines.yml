name: 1st Pipeline

trigger:
  - main

pool: Evening

stages:
  - stage: Terraform
    displayName: 'Terraform Infrastructure'
    jobs:
      - job: TerraformJob
        displayName: 'Terraform Deployment'
        steps:
            - task: TerraformInstaller@1
              inputs:
                terraformVersion: 'latest'
            - task: TerraformTask@5
              inputs:
                provider: 'azurerm'
                command: 'init'
                backendServiceArm: 'WednesdaySC'
                backendAzureRmOverrideSubscriptionID: '73c9b1d1-79bb-4bf7-8b46-db211fe52d6f'
                backendAzureRmResourceGroupName: 'rg-paglabackend'
                backendAzureRmStorageAccountName: 'paglabackend2'
                backendAzureRmContainerName: 'newcontainer'
                backendAzureRmKey: 'terraform.tfstate'
            - task: TerraformTask@5
              inputs:
                provider: 'azurerm'
                command: 'validate'
            - task: TerraformTask@5
              inputs:
                provider: 'azurerm'
                command: 'plan'
                environmentServiceNameAzureRM: 'WednesdaySC'
                environmentAzureRmOverrideSubscriptionID: '73c9b1d1-79bb-4bf7-8b46-db211fe52d6f'
            - task: TerraformTask@5
              inputs:
                provider: 'azurerm'
                command: 'apply'
                commandOptions: 'auto-approve'
                environmentServiceNameAzureRM: 'WednesdaySC'
                environmentAzureRmOverrideSubscriptionID: '73c9b1d1-79bb-4bf7-8b46-db211fe52d6f'