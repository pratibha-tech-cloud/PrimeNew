# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main
pool:  NewAgentPool
steps:
- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendServiceArm: 'FreshSc'
    backendAzureRmOverrideSubscriptionID: '73c9b1d1-79bb-4bf7-8b46-db211fe52d6f'
    backendAzureRmResourceGroupName: 'rg-paglabackend'
    backendAzureRmStorageAccountName: 'paglabackend2'
    backendAzureRmContainerName: 'newcontainer'
    backendAzureRmKey: 'terraform.tfstate'
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'validate'
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'apply'
    commandOptions: '--auto-approve'
    environmentServiceNameAzureRM: 'FreshSc'
    environmentAzureRmOverrideSubscriptionID: 'bc304d74-dfec-4f01-af8f-f598f6619edb'
    environmentAzureRmUseIdTokenGeneration: true